services:
  - type: web
    name: saath
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NODE_ENV
        value: production
      - key: TAVUS_API_KEY
        sync: false
      - key: TAVUS_PAL_ID
        value: pe877b0fc929
      - key: TAVUS_DEPLOYMENT_ID
        value: 7b2b95a3-b71f-4488-8606-aaeaf168e2f2
      - key: PUBLIC_ORIGIN
        sync: false
